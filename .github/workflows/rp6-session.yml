name: RP6 UP-01 session delivery
on:
  push:
    paths: &session_paths
      - 'scripts/**'
      - 'make-steamos-sm8650.sh'
      - 'steamos-overlay/usr/share/steamos-arm/up-01.json'
      - 'steamos-overlay/usr/lib/steamos/**'
      - 'steamos-overlay/usr/lib/systemd/user/steam.service.d/**'
      - 'sm8650-overlay/usr/src/konkr-focusfix/**'
      - 'sm8650-overlay/usr/lib/konkr/konkr-focusfix'
      - 'sm8650-overlay/usr/lib/systemd/system/plugin_loader.service'
      - 'external-and-mods/kernel-common/**'
      - 'external-and-mods/konkr-update/**'
      - 'external-and-mods/Decky/loader.json'
      - '.github/workflows/rp6-session.yml'
  pull_request:
    paths: *session_paths
  workflow_dispatch:
jobs:
  source-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y device-tree-compiler binutils rsync gcc libx11-dev xvfb
      - run: python -m pip install -r scripts/tests/requirements.txt
      - run: python -m unittest discover -s scripts/tests -v
      - run: sudo "$(command -v python)" -m unittest scripts.tests.test_rp6_updater.UpdaterTests.test_payload_capabilities_survive_extract_upgrade_and_restore -v
      - run: |
          bash -n scripts/apply-overlays.sh scripts/import-sm8550-kernel.sh scripts/install-rp6-session.sh external-and-mods/kernel-common/build.sh steamos-overlay/usr/lib/steamos/gamescope-session
          sh -n external-and-mods/kernel-common/initramfs/init external-and-mods/kernel-common/initramfs/mount-etc-overlay steamos-overlay/usr/lib/steamos/wait-gamescope-env
