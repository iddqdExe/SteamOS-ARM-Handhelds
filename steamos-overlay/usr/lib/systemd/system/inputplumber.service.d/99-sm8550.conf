[Unit]
Description=InputPlumber (SM8550 deck-uhid + OSK keyboard haptic)
After=sm8550-fixpad.service systemd-udevd.service
Wants=sm8550-fixpad.service
StartLimitIntervalSec=0

[Service]
# Repeat calibration on every daemon start. A validated RP6 without its
# native MCU node must retry before InputPlumber caches any axis metadata.
ExecStartPre=/usr/lib/steamos/sm8550-fixpad apply 740
Restart=on-failure
RestartSec=3
